<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mentalidade Financeira</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500;600&display=swap');

:root {
  --bg: #0c0b08;
  --s1: #141310;
  --s2: #1c1a16;
  --bd: rgba(212,180,120,0.1);
  --bd2: rgba(212,180,120,0.2);
  --gold: #d4b478;
  --gold2: #f0d090;
  --gold3: #a07840;
  --cream: #f5efe0;
  --muted: #7a7060;
  --err: #e06060;
  --r: 12px;
  --fh: 'Playfair Display', serif;
  --fb: 'Inter', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  background: var(--bg);
  color: var(--cream);
  font-family: var(--fb);
  min-height: 100vh;
}

.orb { position: fixed; border-radius: 50%; filter: blur(160px); pointer-events: none; z-index: 0; }
.orb.a { width: 700px; height: 700px; background: rgba(212,180,120,0.055); top: -300px; right: -200px; }
.orb.b { width: 500px; height: 500px; background: rgba(160,120,64,0.04); bottom: -200px; left: -150px; }

.app { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 48px 20px 80px; }

header { text-align: center; margin-bottom: 40px; }
.cross {
  display: inline-flex; align-items: center; justify-content: center;
  width: 48px; height: 48px; margin-bottom: 20px;
  background: linear-gradient(135deg, var(--gold), var(--gold3));
  border-radius: 14px; font-size: 24px;
  box-shadow: 0 0 40px rgba(212,180,120,0.2);
}
.header-title {
  font-family: var(--fh); font-size: clamp(26px, 7vw, 38px);
  font-weight: 900; letter-spacing: -0.5px; line-height: 1.1;
  color: var(--cream); margin-bottom: 8px;
}
.header-sub { font-size: 13px; color: var(--muted); letter-spacing: 0.04em; }

.sec { display: none; animation: rise 0.35s ease; }
.sec.on { display: block; }
@keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }

.panel { background: var(--s1); border: 1px solid var(--bd); border-radius: var(--r); padding: 24px; margin-bottom: 14px; }

label { display: block; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
input[type=text], input[type=date] {
  width: 100%; background: var(--s2); border: 1px solid var(--bd); border-radius: 8px;
  color: var(--cream); font-family: var(--fb); font-size: 14px; padding: 11px 12px;
  outline: none; transition: border 0.2s; margin-bottom: 14px; color-scheme: dark;
}
input:focus { border-color: rgba(212,180,120,0.45); }

.progress-wrap { margin-bottom: 20px; }
.progress-lbl { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 8px; }
.progress-lbl b { color: var(--gold); }
.progress-track { height: 5px; background: var(--s2); border-radius: 999px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold3), var(--gold)); border-radius: 999px; transition: width 0.35s ease; }

.q-text { font-family: var(--fh); font-size: 20px; font-weight: 700; line-height: 1.35; margin-bottom: 20px; }

.opt { display: flex; align-items: center; gap: 12px; background: var(--s2); border: 1px solid var(--bd); border-radius: 10px; padding: 14px 16px; cursor: pointer; transition: all 0.2s; margin-bottom: 10px; }
.opt:hover { border-color: var(--bd2); }
.opt.sel { background: rgba(212,180,120,0.1); border-color: var(--gold); }
.opt-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--bd2); flex-shrink: 0; position: relative; }
.opt.sel .opt-dot { border-color: var(--gold); }
.opt.sel .opt-dot::after { content:''; position:absolute; inset:2px; border-radius:50%; background: var(--gold); }
.opt-txt { font-size: 14px; color: var(--cream); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 13px 24px; border-radius: 999px; font-family: var(--fh); font-size: 14px; font-weight: 700; cursor: pointer; border: none; transition: all 0.2s; text-decoration: none; letter-spacing: 0.01em; }
.btn-gold { background: linear-gradient(135deg, var(--gold3), var(--gold)); color: #0c0b08; width: 100%; box-shadow: 0 4px 24px rgba(212,180,120,0.25); }
.btn-gold:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(212,180,120,0.4); }
.btn-gold:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-ghost { background: transparent; color: var(--muted); font-size: 12px; font-family: var(--fb); padding: 10px 16px; border-radius: 999px; }
.btn-ghost:hover { color: var(--cream); }
.btn-row { display: flex; gap: 10px; align-items: center; }

.err-box { font-size: 12px; color: var(--err); margin-bottom: 12px; display: none; }

.prog-wrap { text-align: center; padding: 50px 0; }
.spinner { width: 44px; height: 44px; border: 3px solid rgba(212,180,120,0.15); border-top-color: var(--gold); border-radius: 50%; margin: 0 auto 20px; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.prog-lbl { font-family: var(--fh); font-size: 16px; font-weight: 700; }

.res-wrap { text-align: center; }
.res-icon { font-size: 52px; display: block; margin-bottom: 14px; animation: pop 0.55s cubic-bezier(0.34,1.56,0.64,1); }
@keyframes pop { from{transform:scale(0)} to{transform:scale(1)} }
.res-title { font-family: var(--fh); font-size: 26px; font-weight: 900; margin-bottom: 10px; }
.res-desc { color: var(--cream); opacity: 0.85; font-size: 14px; line-height: 1.7; margin-bottom: 24px; text-align: left; }
.res-warn { font-size: 11px; color: var(--muted); margin-bottom: 16px; }
</style>
</head>
<body>

<div class="orb a"></div>
<div class="orb b"></div>

<div class="app">

  <header>
    <div class="cross">✝</div>
    <h1 class="header-title">Qual o seu nível de<br>mentalidade financeira?</h1>
    <p class="header-sub">Responda com sinceridade e descubra onde você está</p>
  </header>

  <!-- STEP: DADOS -->
  <div class="sec on" id="sec-start">
    <div class="panel">
      <label>Nome</label>
      <input type="text" id="in-nome" placeholder="Seu nome completo" autocomplete="name">
      <label>Data</label>
      <input type="date" id="in-data">
      <div class="err-box" id="start-err"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-gold" id="btn-start" onclick="startQuiz()">Começar →</button>
    </div>
  </div>

  <!-- STEP: PERGUNTAS -->
  <div class="sec" id="sec-quiz">
    <div class="progress-wrap">
      <div class="progress-lbl"><span>Pergunta <b id="q-n">1</b> de <b id="q-tot">–</b></span><span id="q-pct">0%</span></div>
      <div class="progress-track"><div class="progress-fill" id="q-fill" style="width:0%"></div></div>
    </div>
    <div class="panel">
      <div class="q-text" id="q-text"></div>
      <div id="q-opts"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="btn-back" onclick="prevQ()">← Voltar</button>
      <button class="btn btn-gold" id="btn-next" style="flex:1" disabled onclick="nextQ()">Próxima →</button>
    </div>
  </div>

  <!-- STEP: ENVIANDO -->
  <div class="sec" id="sec-sending">
    <div class="prog-wrap">
      <div class="spinner"></div>
      <div class="prog-lbl">Calculando resultado...</div>
    </div>
  </div>

  <!-- STEP: RESULTADO -->
  <div class="sec" id="sec-result">
    <div class="res-wrap">
      <span class="res-icon">✝️</span>
      <div class="res-title" id="res-title"></div>
      <div class="res-desc" id="res-desc"></div>
      <div class="res-warn" id="res-warn" style="display:none;">Não foi possível salvar sua resposta no servidor, mas o resultado acima é válido.</div>
      <button class="btn btn-gold" onclick="restart()">Refazer o quiz</button>
    </div>
  </div>

</div>

<script>
// ═══════════════════════════════════
// PERGUNTAS — Diagnóstico de mentalidade financeira
// Baseado nos 5 Níveis de Mentalidade do livro "Dinheiro Chama Dinheiro?
// Só se você mudar sua mentalidade" (Weily Toro Machado).
// Cada opção tem um trait de nivel1 (Bloqueada) a nivel5 (Evoluída); ao
// final, o nível com mais ocorrências entre as respostas é o exibido.
// ═══════════════════════════════════
const QUESTIONS = [
  {
    texto: 'Quando você pensa em olhar seus extratos, boletos e dívidas...',
    opcoes: [
      { texto: 'Sinto vergonha e medo, e evito olhar por dias', trait: 'nivel1' },
      { texto: 'Sei que preciso organizar, mas fico adiando', trait: 'nivel2' },
      { texto: 'Organizo tudo por um tempo, depois deixo acumular de novo', trait: 'nivel3' },
      { texto: 'Tenho uma rotina de checar e planejar, mesmo ajustando detalhes', trait: 'nivel4' },
      { texto: 'Olho com tranquilidade — é só uma ferramenta que eu domino', trait: 'nivel5' },
    ]
  },
  {
    texto: 'Qual pensamento mais aparece quando você imagina ganhar mais dinheiro?',
    opcoes: [
      { texto: '"Dinheiro é ferramenta a serviço do meu propósito"', trait: 'nivel5' },
      { texto: '"Tenho um plano e sigo ele, mesmo com desafios"', trait: 'nivel4' },
      { texto: '"Tenho dias de foco total e dias que jogo tudo pro alto"', trait: 'nivel3' },
      { texto: '"Sei que preciso mudar, mas nunca mantenho o ritmo"', trait: 'nivel2' },
      { texto: '"Não é pra mim, nunca vai dar certo"', trait: 'nivel1' },
    ]
  },
  {
    texto: 'Diante de um aperto financeiro inesperado, sua reação mais comum é...',
    opcoes: [
      { texto: 'Entro em pânico e travo, sem conseguir agir', trait: 'nivel1' },
      { texto: 'Fico ansioso(a) e reajo por impulso, sem planejar', trait: 'nivel2' },
      { texto: 'Às vezes analiso com calma, às vezes reajo no desespero', trait: 'nivel3' },
      { texto: 'Paro, analiso as opções e decido com clareza', trait: 'nivel4' },
      { texto: 'Já tenho reserva e plano para esse tipo de situação', trait: 'nivel5' },
    ]
  },
  {
    texto: 'Sobre aprender mais sobre finanças (cursos, planilhas, mentoria)...',
    opcoes: [
      { texto: 'Já ajudo outras pessoas a organizarem a vida financeira', trait: 'nivel5' },
      { texto: 'Busco aprender continuamente e aplico o que aprendo', trait: 'nivel4' },
      { texto: 'Consigo seguir por um tempo, mas oscilo bastante', trait: 'nivel3' },
      { texto: 'Já comecei vários cursos e planilhas e larguei todos no meio', trait: 'nivel2' },
      { texto: 'Sinto vergonha de admitir que não sei lidar com isso', trait: 'nivel1' },
    ]
  },
  {
    texto: 'Quando alguém próximo prospera financeiramente, o que você sente?',
    opcoes: [
      { texto: 'Inveja ou a sensação de que "nunca vai ser eu"', trait: 'nivel1' },
      { texto: 'Motivação por um dia, que logo esfria', trait: 'nivel2' },
      { texto: 'Inspiração, mas também comparação que me desanima às vezes', trait: 'nivel3' },
      { texto: 'Inspiração real, que uso para ajustar meus próprios planos', trait: 'nivel4' },
      { texto: 'Alegria genuína — sei que abundância não é limitada', trait: 'nivel5' },
    ]
  },
  {
    texto: 'Como você lida com uma decisão financeira importante e difícil?',
    opcoes: [
      { texto: 'Decido com clareza, usando razão e escuta ao mesmo tempo', trait: 'nivel4' },
      { texto: 'Evito decidir — fico adiando até a situação decidir por mim', trait: 'nivel1' },
      { texto: 'Sei o que preciso fazer, mas não consigo agir', trait: 'nivel2' },
      { texto: 'Decido, mas volto atrás quando bate o medo', trait: 'nivel3' },
      { texto: 'Decido com serenidade — dinheiro não define meu valor', trait: 'nivel5' },
    ]
  },
  {
    texto: 'Que frase mais parece com algo que você já pensou ou ouviu em casa?',
    opcoes: [
      { texto: '"Quem nasce pobre, morre pobre"', trait: 'nivel1' },
      { texto: '"Eu sei que preciso mudar, mas é difícil manter"', trait: 'nivel2' },
      { texto: '"Já melhorei bastante, mas ainda oscilo"', trait: 'nivel3' },
      { texto: '"Tenho direção clara e planejo antes de agir"', trait: 'nivel4' },
      { texto: '"Dinheiro é instrumento — está no seu devido lugar na minha vida"', trait: 'nivel5' },
    ]
  },
  {
    texto: 'Olhando para os últimos 12 meses, o que melhor descreve sua jornada financeira?',
    opcoes: [
      { texto: 'Continua repetindo os mesmos problemas de sempre', trait: 'nivel1' },
      { texto: 'Comecei a mudar algumas vezes, mas nunca sustentei', trait: 'nivel2' },
      { texto: 'Tive avanços reais, mas com recaídas no meio do caminho', trait: 'nivel3' },
      { texto: 'Estou construindo algo sólido, com metas e planejamento', trait: 'nivel4' },
      { texto: 'Minhas escolhas financeiras já inspiram outras pessoas', trait: 'nivel5' },
    ]
  },
];

// Um resultado por nível — baseado nos 5 Níveis de Mentalidade do livro.
const PERFIS = {
  nivel1: {
    titulo: 'Mentalidade Bloqueada',
    descricao: 'Você evita olhar de frente para sua realidade financeira. Vergonha, medo e culpa aparecem quando o assunto surge, e crenças antigas ("nunca vai dar certo", "não é pra mim") acabam decidindo por você antes mesmo de você tentar. O primeiro passo não é uma revolução — é reconhecer o bloqueio e dar um passo pequeno hoje, não amanhã.'
  },
  nivel2: {
    titulo: 'Mentalidade Estagnada',
    descricao: 'Você sabe o que precisa mudar, mas não sustenta o ritmo. Começa animado(a) e desanima logo depois — como um carro ligado com o freio de mão puxado. Não falta informação, falta ação consistente. O caminho é começar pequeno: um hábito simples por vez, e alguém de confiança para acompanhar o progresso.'
  },
  nivel3: {
    titulo: 'Mentalidade em Transição',
    descricao: 'A mudança já começou — só que ainda com oscilação: dias bons e dias ruins, entre o "eu antigo" e o "eu novo". Cada recaída é aprendizado, não fracasso. O foco agora é manter consistência, trocar comparação com os outros por ação sobre si mesmo, e celebrar as pequenas vitórias no caminho.'
  },
  nivel4: {
    titulo: 'Mentalidade em Construção',
    descricao: 'Você já tem direção e planeja antes de agir. Não está mais no caos, mas os desafios continuam — os alicerces foram lançados e a casa está sendo construída. A partir daqui, vale aprofundar: metas mais audaciosas e proximidade com quem também está evoluindo.'
  },
  nivel5: {
    titulo: 'Mentalidade Evoluída',
    descricao: 'Dinheiro e negócio estão no lugar certo na sua vida: ferramentas a serviço do propósito, não prova de valor. Suas decisões não nascem de culpa, pressa ou comparação — e isso já inspira outras pessoas. O próximo passo é continuar crescendo e ajudar quem ainda está no início da jornada.'
  },
};

// Endpoint do backend PHP que grava a resposta no banco.
const SAVE_URL = 'api/save.php';

// ═══════════════════════════════════
// ESTADO
// ═══════════════════════════════════
let nome = '';
let dataResposta = '';
let qi = 0;
let respostas = new Array(QUESTIONS.length).fill(null);

document.getElementById('in-data').value = new Date().toISOString().slice(0, 10);

function showSec(id) {
  document.querySelectorAll('.sec').forEach(s => s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function startQuiz() {
  const n = document.getElementById('in-nome').value.trim();
  const d = document.getElementById('in-data').value;
  const err = document.getElementById('start-err');
  if (!n) { err.textContent = 'Informe seu nome.'; err.style.display = 'block'; return; }
  if (!d) { err.textContent = 'Informe a data.'; err.style.display = 'block'; return; }
  err.style.display = 'none';
  nome = n; dataResposta = d; qi = 0;
  respostas = new Array(QUESTIONS.length).fill(null);
  renderQ();
  showSec('sec-quiz');
}

function renderQ() {
  const q = QUESTIONS[qi];
  document.getElementById('q-n').textContent = qi + 1;
  document.getElementById('q-tot').textContent = QUESTIONS.length;
  const pct = Math.round(((qi + 1) / QUESTIONS.length) * 100);
  document.getElementById('q-pct').textContent = pct + '%';
  document.getElementById('q-fill').style.width = pct + '%';
  document.getElementById('q-text').textContent = q.texto;

  const wrap = document.getElementById('q-opts');
  wrap.innerHTML = '';
  q.opcoes.forEach((op, oi) => {
    const div = document.createElement('div');
    div.className = 'opt' + (respostas[qi] === oi ? ' sel' : '');
    div.innerHTML = '<div class="opt-dot"></div><div class="opt-txt"></div>';
    div.querySelector('.opt-txt').textContent = op.texto;
    div.onclick = () => selectOpt(oi);
    wrap.appendChild(div);
  });

  document.getElementById('btn-back').style.visibility = qi === 0 ? 'hidden' : 'visible';
  document.getElementById('btn-next').disabled = respostas[qi] === null;
  document.getElementById('btn-next').textContent = qi === QUESTIONS.length - 1 ? 'Ver resultado →' : 'Próxima →';
}

function selectOpt(oi) {
  respostas[qi] = oi;
  renderQ();
}

function prevQ() {
  if (qi === 0) return;
  qi--;
  renderQ();
}

function nextQ() {
  if (respostas[qi] === null) return;
  if (qi < QUESTIONS.length - 1) {
    qi++;
    renderQ();
  } else {
    finishQuiz();
  }
}

function computeProfile() {
  const counts = {};
  QUESTIONS.forEach((q, i) => {
    const oi = respostas[i];
    if (oi === null) return;
    const trait = q.opcoes[oi].trait;
    counts[trait] = (counts[trait] || 0) + 1;
  });
  let best = null, bestN = -1;
  Object.keys(counts).forEach(k => {
    if (counts[k] > bestN) { bestN = counts[k]; best = k; }
  });
  return best;
}

async function finishQuiz() {
  showSec('sec-sending');

  const perfilChave = computeProfile();
  const perfil = PERFIS[perfilChave] || { titulo: 'Resultado', descricao: '' };

  const payload = {
    nome,
    data: dataResposta,
    perfilChave,
    perfilTitulo: perfil.titulo,
    respostas: QUESTIONS.map((q, i) => ({
      pergunta: q.texto,
      resposta: respostas[i] !== null ? q.opcoes[respostas[i]].texto : null,
      trait: respostas[i] !== null ? q.opcoes[respostas[i]].trait : null,
    })),
  };

  let saved = true;
  try {
    const res = await fetch(SAVE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json().catch(() => ({ ok: false }));
    saved = !!data.ok;
  } catch (e) {
    saved = false;
  }

  document.getElementById('res-title').textContent = perfil.titulo;
  document.getElementById('res-desc').textContent = perfil.descricao;
  document.getElementById('res-warn').style.display = saved ? 'none' : 'block';
  showSec('sec-result');
}

function restart() {
  document.getElementById('in-nome').value = '';
  document.getElementById('in-data').value = new Date().toISOString().slice(0, 10);
  showSec('sec-start');
}
</script>
</body>
</html>
